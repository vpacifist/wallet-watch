<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WETH/USDC Aerodrome Prices</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>WETH/USDC 0.05% Aerodrome</h1>
          <p>Поминутные цены за февраль, март и апрель 2026</p>
        </div>
        <div class="status" id="status">Загрузка CSV...</div>
      </header>

      <section class="panel chartPanel">
        <div class="panelHead">
          <div class="filters" aria-label="Фильтр периода">
            <button class="active" data-range="all">Все</button>
            <button data-range="2026-02">Фев</button>
            <button data-range="2026-03">Мар</button>
            <button data-range="2026-04">Апр</button>
          </div>
          <div class="rangeNavigator" id="rangeNavigator" aria-label="Окно масштаба">
            <div class="rangeTrack" id="rangeTrack">
              <div class="rangeWindow" id="rangeWindow" role="slider" aria-label="Текущий диапазон" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
          </div>
        </div>
        <div class="chartWrap">
          <canvas id="priceChart" width="1400" height="560"></canvas>
          <div class="tooltip" id="tooltip" hidden></div>
          <div class="tooltip simTooltip" id="simTooltip" hidden></div>
          <div class="tooltip tableTooltip" id="tableTooltip" hidden></div>
        </div>
      </section>

      <section class="panel simulatorPanel" aria-label="Симулятор позиции">
        <div class="simControls">
          <label class="field">
            <span>Начало симуляции</span>
            <input id="simStartInput" type="text" value="2026-02-01 00:00" />
          </label>
          <label class="field endField">
            <span>Конец симуляции</span>
            <input id="simEndInput" type="text" value="2026-04-30 23:59" />
          </label>
          <label class="field depositField">
            <span>Депозит, USDC</span>
            <input id="depositInput" type="text" value="10'000" />
          </label>
          <label class="field rangePercentField">
            <span>Диапазон, %</span>
            <input id="rangePercentInput" type="text" value="1" />
          </label>
          <div class="simButtons" aria-label="Управление симуляцией">
            <div class="playbackButtons">
              <button id="runSimulation" class="startButton" type="button" title="Старт симуляции">START</button>
              <button id="stepBack" type="button" title="Назад на минуту">&#9664;</button>
              <button id="stepForward" type="button" title="Вперед на минуту">&#9654;</button>
            </div>
            <button id="resetSimulation" class="resetButton" type="button" title="Reset simulation">RESET</button>
          </div>
          <div class="simTotals">
            <div>
              <span>Стоимость позиции</span>
              <strong id="currentPositionValue">$0.00</strong>
            </div>
            <div>
              <span>AERO earned, USDC</span>
              <strong id="currentAeroEarned">$0.00</strong>
            </div>
          </div>
        </div>
        <div class="simNotice" id="simNotice">Щелкни по графику, чтобы выбрать минуту старта, затем нажми START.</div>
        <div class="simTableWrap" id="simTableWrap" hidden>
          <table class="simTable">
            <colgroup>
              <col class="timeCol" />
              <col class="eventCol" />
              <col class="valueCol" />
              <col class="priceCol" />
              <col class="tokenCol" />
              <col class="tokenCol" />
              <col class="aeroCol" />
              <col class="haircutCol" />
              <col class="reliabilityCol" />
            </colgroup>
            <thead>
              <tr>
                <th>Дата, время</th>
                <th>Событие</th>
                <th>Стоимость, USDC</th>
                <th>Цена WETH</th>
                <th>WETH</th>
                <th>USDC</th>
                <th>AERO, USDC</th>
                <th>AERO haircut</th>
                <th>Достоверность</th>
              </tr>
            </thead>
            <tbody id="simTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./simulation_core.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
