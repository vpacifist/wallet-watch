name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check simulation_engine.js
          node --check simulation_core.js
          node --check scripts/simulation_runtime.js
          node --check scripts/test_simulation_worker.js

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/serve_with_rpc.py \
            scripts/warm_sim_cache.py \
            scripts/export_dexpaprika_ohlcv.py

      - name: Start local RPC server
        env:
          BASE_RPC_URLS: ${{ secrets.BASE_RPC_URLS }}
          BASE_ARCHIVE_RPC_URLS: ${{ secrets.BASE_ARCHIVE_RPC_URLS }}
        run: |
          python scripts/serve_with_rpc.py > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..40}; do
            if curl --silent --fail http://127.0.0.1:8003/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run regression tests
        run: npm test
