name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check simulation_engine.js
          node --check simulation_core.js
          node --check scripts/simulation_runtime.js
          node --check scripts/test_simulation_worker.js

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/serve_with_rpc.py \
            scripts/warm_sim_cache.py \
            scripts/export_dexpaprika_ohlcv.py

      - name: Run regression tests
        run: npm test
